<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10 Alien Force</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .background {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #072d1f 50%, #00ff55 50%);
            position: relative;
        }

        nav {
            padding: 15px 20px;
            z-index: 10;
        }

        .menu-links {
            display: flex;
            gap: 15px;
        }

        .menu-links a {
            color: #ffffff;
            background-color: #000000;
            padding: 5px 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #ffffff;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .menu-links a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .content-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .logo-container {
            max-width: 500px; /* Tamanho ajustado para dar destaque à imagem */
            width: 100%;
            text-align: center;
            z-index: 5;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="background">
        <nav>
            <div class="menu-links">
                <a href="#">HOME</a>
                <a href="#">SOBRE</a>
            </div>
        </nav>

        <div class="content-center">
            <!-- A imagem foi inserida e centralizada aqui -->
            <div class="logo-container">
                <img src="https://en.wikipedia.org/wiki/Ben_10:_Alien_Force" alt="Ben 10 Alien Force">
            </div>
        </div>
    </div>

</body>
</html>
